[project]
name = "looped-induction"
version = "0.1.0"
description = "induction head formation in looped models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "circuitsvis>=1.43.3",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "ipykernel>=7.4.0",
    "jaxtyping>=0.3.11",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "torch>=2.14.1,<2.15",
    "tqdm>=4.70.1",
    "transformer-lens>=2.16,<3",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
