[project]
name = "looped-induction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "circuitsvis>=1.43.3",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "ipykernel>=7.4.0",
    "jaxtyping>=0.3.11",
    "plotly>=7.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformer-lens>=2.16,<3",
]

[project.scripts]
looped-induction = "looped_induction:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
